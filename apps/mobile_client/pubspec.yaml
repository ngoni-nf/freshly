name: freshly_client
description: Freshly — freshness on demand. Book barbers, stylists and nail techs to your door or at a shop near you.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Apple's icon language. SF Symbols itself is licensed to Apple platforms
  # only and cannot ship in an Android binary; this is the Flutter team's
  # freely licensed set drawn from the same shapes, so it is legal everywhere
  # and looks right next to the type.
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  freshly_core:
    path: ../../packages/freshly_core

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.1
  firebase_crashlytics: ^4.1.1
  firebase_analytics: ^11.3.1
  # Phone-number sign-in. Firebase sends the SMS and proves the number; the
  # backend exchanges the resulting token for a Freshly session.
  firebase_auth: ^5.3.1

# Every entry above is imported by a screen. Nothing is declared "for later" —
# an unused native plugin still runs its Gradle and CocoaPods work on every
# build and can fail resolution on its own, so it earns its place or it goes.
# intl arrives transitively through freshly_core, which is where it is used.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# Inter is intentionally not bundled yet. Declaring a font file that is not on
# disk fails the build outright, and the system font is a perfectly good
# stand-in until the licensed files are added. To bundle it later, drop the
# .ttf files into assets/fonts/ and restore the fonts: block.
