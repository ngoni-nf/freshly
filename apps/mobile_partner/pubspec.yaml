name: freshly_partner
description: Freshly Partner — take bookings, get paid, run your chair from your phone.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Apple's icon language. SF Symbols itself is licensed to Apple platforms
  # only and cannot ship in an Android binary; this is the Flutter team's
  # freely licensed set drawn from the same shapes, so it is legal everywhere
  # and looks right next to the type.
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  freshly_core:
    path: ../../packages/freshly_core

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  geolocator: ^13.0.1
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  # Client avatars and portfolio thumbnails. Same version as the client app on
  # purpose: two versions of an image cache in one workspace is a resolution
  # conflict waiting for whichever app upgrades first.
  cached_network_image: ^3.4.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.1
  # Phone-number sign-in. Firebase sends the SMS and proves the number; the
  # backend exchanges the resulting token for a Freshly session.
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.1
  firebase_analytics: ^11.3.1

# Location permissions are handled by geolocator's own request flow, so
# permission_handler is not needed here. Maps are not needed either: the job
# screen hands navigation to whatever maps app the provider already uses,
# which is both better than anything we would build and one less native
# dependency in the release binary.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
