name: freshly_core
description: Shared domain models, API client, realtime transport and design system for the Freshly iOS and Android apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Apple's icon language. SF Symbols itself is licensed to Apple platforms
  # only and cannot ship in an Android binary; this is the Flutter team's
  # freely licensed set drawn from the same shapes, so it is legal everywhere
  # and looks right next to the type.
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  # flutter_localizations pins intl exactly, so this range must include the
  # version the installed SDK ships or resolution fails outright.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Deliberately absent: freezed, json_serializable and build_runner. Nothing in
# this package is generated — the models are hand-written fromJson factories —
# and those three pin the analyzer, which is the usual reason a package stops
# resolving the moment someone upgrades their Dart SDK.
#
# geolocator is also absent: the apps that need position declare it themselves.
# A shared package should not force a platform plugin on every consumer.

flutter:
  uses-material-design: true
