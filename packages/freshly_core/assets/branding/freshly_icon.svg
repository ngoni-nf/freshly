<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="freshMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#00B87A"/>
    </linearGradient>

    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>

    <!-- The ambient glow was written as filter="blur(40px)", which is CSS and
         not SVG. SVG needs a filter element referenced by url(), so the glow
         silently did not render — and flutter_svg would have dropped it too. -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00F59B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <circle cx="340" cy="160" r="140" fill="#00F59B" opacity="0.12" filter="url(#ambientGlow)"/>

  <g filter="url(#dropShadow)">
    <path d="M 152 120
             L 216 120
             C 220 120 224 124 224 128
             L 224 384
             C 224 388 220 392 216 392
             L 152 392
             C 148 392 144 388 144 384
             L 144 128
             C 144 124 148 120 152 120 Z"
          fill="url(#freshMint)"/>

    <path d="M 224 120
             L 332 120
             C 338 120 342 124 340 130
             L 326 182
             C 324 188 318 192 312 192
             L 224 192 Z"
          fill="url(#freshMint)"/>

    <path d="M 224 240
             L 292 240
             C 298 240 302 244 300 250
             L 288 296
             C 286 302 280 306 274 306
             L 224 306 Z"
          fill="url(#freshMint)"/>

    <path d="M 370 120
             Q 370 170 320 170
             Q 370 170 370 220
             Q 370 170 420 170
             Q 370 170 370 120 Z"
          fill="url(#starGlow)"/>
  </g>
</svg>
