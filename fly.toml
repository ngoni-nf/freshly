# ---------------------------------------------------------------------------
# Fly.io deployment for the Freshly API.
#
# Region: `lhr` (London). Dublin would be ideal — Supabase is in eu-west-1 —
# but Fly refuses to place machines in `dub` on this account: "Region 'dub'
# cannot host your machine". London is the nearest region it will accept, and
# London to Ireland is roughly 10ms, so the co-location argument still holds.
#
# The rule it holds to is that the API, the database and Redis stay
# co-located: a request makes several round trips to each, so a split stack
# pays the crossing per QUERY rather than once per HTTP call.
#
# South Africa was the obvious wish for a Johannesburg-first product, and Fly
# has jnb while Upstash has a South Africa region — but Supabase has no African
# region at all. Its dropdown offers the Americas, Europe, Asia-Pacific and
# Sao Paulo, and nothing on the continent. The database cannot follow, and the
# database is the constraint, so moving the other two alone would have made
# every query a 150ms crossing instead of a 1ms one.
#
# Revisit if Supabase ever opens af-south-1. Until then this is the fastest
# arrangement available, and the existing project needs no migration.
# `app` is a placeholder: `fly launch` will set your real app name.
# ---------------------------------------------------------------------------
app = "freshly-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # staging, not production, and deliberately.
  #
  # Production refuses to boot on a mock payment, payout or KYC adapter, on a
  # bypassed OTP, or without push — see the guards in configuration.ts. Every
  # one of those is still mock, because each needs a signed vendor contract
  # that does not exist yet. Setting production here would simply crash on
  # start; setting it while stubbing the guards would be worse, because the
  # first real booking would take money through an adapter that moves none.
  #
  # staging runs the same code with the mock rails, which is exactly what a
  # test build on a real handset needs. Flip to production when the gateway,
  # payout and KYC contracts are live — that is the last switch, not the first.
  NODE_ENV = "staging"
  PORT = "3000"
  # The database is reached over the public internet, so TLS is not optional.
  DATABASE_SSL = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Never scale to zero. Dispatch waves run on in-process timers and the
  # realtime gateway holds websockets open; a suspended machine drops both,
  # and a provider simply never receives the offer.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Note on scaling past one machine: socket.io needs its Redis adapter before a
# second instance is added, or a client connected to machine B never receives
# an offer published from machine A. One machine is correct until that is done.
