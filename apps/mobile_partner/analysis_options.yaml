include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # require_trailing_commas is deliberately absent. Dart 3.10 replaced the
    # formatter with the "tall style", which decides trailing commas itself —
    # so the lint now fights `dart format` rather than helping it. Run
    # `dart format .` instead of hand-placing commas.
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
