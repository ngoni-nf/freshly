name: Deploy API

# Only from main, and only once CI has gone green on that same commit. A deploy
# that races the test suite is a deploy that can ship a red build.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Kept for a deliberate redeploy or a rollback.
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, then deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Schema first, and as its own step. A container that boots against a
      # schema it does not expect fails in a hundred confusing ways; a failed
      # migration fails here, loudly, with the deploy not yet started.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'
        run: node infra/db/migrate.mjs up

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Confirm it is serving
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ secrets.API_BASE_URL }}/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "the deploy reported success but /health never answered"; exit 1
