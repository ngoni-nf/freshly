name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, types, unit and end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: freshly
          POSTGRES_PASSWORD: freshly
          POSTGRES_DB: freshly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freshly -d freshly"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://freshly:freshly@localhost:5432/freshly
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-that-is-at-least-thirty-two-characters
      PII_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktMzItYnl0ZXMtZXhhY3RseS0hIQ==
      OTP_DEV_BYPASS: 'true'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations and seed
        run: |
          node infra/db/migrate.mjs up
          node infra/db/migrate.mjs seed

      - name: Type check
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Unit tests
        run: npm run test -w @freshly/api

      # Runs against the database directly, no API process needed. It is the
      # only check that proves an unlicensed provider cannot list microblading,
      # which is enforced by a trigger and so cannot be unit tested.
      - name: Credential gate
        run: node scripts/check-credential-gate.cjs

      - name: End-to-end tests
        env:
          RUN_E2E: '1'
        run: npm run test:e2e -w @freshly/api

  mobile:
    name: Mobile — analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the local toolchain. On 3.24 the apps do not compile at all:
      # DropdownButtonFormField.initialValue and the *ThemeData slots are 3.32+.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      # dart analyze fails on errors and warnings by default. --fatal-infos is
      # deliberately off until the first fully green run; turning it on before
      # then just means a red pipeline nobody reads.
      - name: Shared core
        working-directory: packages/freshly_core
        run: |
          flutter pub get
          dart analyze

      - name: Client app
        working-directory: apps/mobile_client
        run: |
          flutter pub get
          dart analyze
          flutter test

      - name: Partner app
        working-directory: apps/mobile_partner
        run: |
          flutter pub get
          dart analyze
          flutter test

      - name: Build Android APKs
        run: |
          cd apps/mobile_client  && flutter build apk --debug --dart-define=API_BASE_URL=http://localhost:3000
          cd ../mobile_partner   && flutter build apk --debug --dart-define=API_BASE_URL=http://localhost:3000

  sql:
    name: SQL — parse every migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pglast
      - name: Parse migrations and seeds
        run: |
          python - <<'PY'
          import glob, sys
          from pglast import parse_sql
          from pglast.parser import ParseError
          failed = False
          for path in sorted(glob.glob('infra/db/**/*.sql', recursive=True)):
              try:
                  parse_sql(open(path).read())
                  print(f'ok   {path}')
              except ParseError as err:
                  failed = True
                  print(f'FAIL {path}: {err}')
          sys.exit(1 if failed else 0)
          PY
